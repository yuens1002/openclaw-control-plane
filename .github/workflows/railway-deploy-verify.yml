name: Railway Deploy Verify

# Confirms the most recent Railway deployment for this service is actually
# healthy -- closes the detection gap from issue #104, where every deploy
# failed for 26+ hours across 7 unrelated commits while this repo's own CI
# (unit tests, typecheck) stayed green the entire time, since it never
# checked whether the real Railway build/deploy succeeded.
#
# DELIBERATELY schedule-triggered, not push-triggered. This repo's Railway
# service has "Wait for CI" enabled (source.checkSuites: true), which holds
# new deployments in WAITING until every push-triggered GitHub check suite on
# that commit finishes, and marks the deployment SKIPPED if any of them
# fails. A push-triggered version of this check would itself BE one of those
# check suites, creating a deadlock: it would wait for the deployment to
# leave WAITING, which Railway will never do until this workflow finishes.
# See packages/openclaw-railway-installer/src/verify-deploy-cli.ts's header
# for the full reasoning. Use `workflow_dispatch` (with an optional
# `target_sha` input) to check on demand.
#
# Deliberately narrower than the deleted Railway Proof Verify workflow
# (findings-and-decisions.md S-6, which tested nothing useful): this only
# asks "is the most recent deployment healthy," not a broader live end-state
# proof.
#
# Skips gracefully (does not fail) until RAILWAY_PROJECT_ID,
# RAILWAY_ENVIRONMENT_ID, and RAILWAY_SERVICE_ID are configured as repo
# secrets.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Check a specific commit's deployment instead of the most recent one"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: railway-deploy-verify
  cancel-in-progress: false

jobs:
  verify-deploy:
    name: Verify Railway deployment is healthy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      # Deliberately NOT `npm ci` -- verify-deploy.ts/verify-deploy-cli.ts's
      # entire import chain (packages/openclaw-railway-installer/src/index.ts
      # and its own sibling imports) uses only node: builtins, no third-party
      # package. A full monorepo `npm ci` here installs everything this
      # script doesn't need, and on a 15-minute recurring schedule was
      # measured taking over 5 minutes on its own -- occasionally exceeding
      # this job's timeout before the actual verify step ever ran. Installing
      # just the two CLIs this job actually uses is enough.
      #
      # Both pinned to the version verified at wiring time -- an unpinned
      # global install on a recurring schedule would silently pick up a
      # future release's behavior change on the very next run.
      - name: Install tsx and Railway CLI
        run: npm install -g --no-audit --no-fund tsx@4.23.12 @railway/cli@5.49.0

      - name: Verify Railway deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_DEPLOY_TARGET_SHA: ${{ inputs.target_sha }}
        run: tsx packages/openclaw-railway-installer/src/verify-deploy-cli.ts
