# Select this file explicitly for the Decision Runtime MCP service. Other
# services in this repository retain their own build configuration.
[build]
builder = "dockerfile"
dockerfilePath = "deploy/decision-runtime-mcp/Dockerfile"
# The repo-root /package.json is deliberately absent from watchPatterns: its
# version field moves on every release, and watching it would redeploy this live
# service once per release for a change the image does not read. This
# Dockerfile invokes no root npm script (it runs `npm ci`, then an explicit
# `tsc -b`), and the manifest's build-relevant content -- `workspaces` and the
# root dependency sets -- is mirrored into /package-lock.json, which stays
# watched. Two things would break that and are guarded in
# tests/decision-runtime-watch-patterns.test.ts: a root install-lifecycle
# script (`npm ci` would run it, changing the image with no watched path
# changing), and this list drifting from the Dockerfile's COPY sources.
# See issue #86, issue #89, and docs/decision-runtime-deployment.md.
watchPatterns = [
  "/apps/mcp/**",
  "/packages/contracts/**",
  "/packages/openclaw-adapter/**",
  "/packages/mcp-service/**",
  "/packages/decision-runtime-mcp/**",
  "/package-lock.json",
  "/tsconfig.json",
  "/tsconfig.base.json",
  "/apps/mcp/package.json",
  "/packages/contracts/package.json",
  "/packages/openclaw-adapter/package.json",
  "/packages/mcp-service/package.json",
  "/packages/decision-runtime-mcp/package.json",
  "/deploy/decision-runtime-mcp/Dockerfile",
  "/deploy/decision-runtime-mcp/railway.toml",
  "/.dockerignore"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
