[build]
builder = "dockerfile"
dockerfilePath = "deploy/decision-runtime/worker.Dockerfile"
# The repo-root /package.json is deliberately absent from watchPatterns: its
# version field moves on every release, and watching it redeployed this live
# service once per release for a change the image does not read. This
# Dockerfile invokes no root npm script (it runs `npm ci`, then an explicit
# `tsc -b`), and the manifest's build-relevant content -- `workspaces` and the
# root dependency sets -- is mirrored into /package-lock.json, which stays
# watched. Two things would break that and are guarded in
# tests/decision-runtime-watch-patterns.test.ts: a root install-lifecycle
# script (`npm ci` would run it, changing the image with no watched path
# changing), and mirroring the release version into the lockfile, which would
# reintroduce the per-release redeploy through /package-lock.json.
# See issue #86 and docs/decision-runtime-deployment.md.
watchPatterns = [
  "/apps/worker/**",
  "/packages/contracts/**",
  "/packages/runtime-auth/**",
  "/packages/db/**",
  "/package-lock.json",
  "/tsconfig.json",
  "/tsconfig.base.json",
  "/apps/worker/package.json",
  "/packages/contracts/package.json",
  "/packages/runtime-auth/package.json",
  "/packages/db/package.json",
  "/deploy/decision-runtime/worker.Dockerfile",
  "/deploy/decision-runtime/worker.railway.toml",
  "/.dockerignore"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
