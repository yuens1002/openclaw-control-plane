services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openclaw_control_plane
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: openclaw
    ports:
      - "5432:5432"
    volumes:
      - openclaw-control-plane-postgres:/var/lib/postgresql/data

volumes:
  openclaw-control-plane-postgres:
